name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-rust:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, "1.75"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Build Rust binary
        run: cargo build --release

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov msgpack mypy
          pip install -e daemon/

      - name: Type check with mypy
        run: |
          cd daemon
          mypy rpytest_daemon/ --ignore-missing-imports

      - name: Run Python tests
        run: |
          cd daemon
          python -m pytest -v --cov=rpytest_daemon

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-rust, test-python]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Build release binary
        run: cargo build --release

      - name: Install dependencies
        run: |
          pip install pytest msgpack
          pip install -e daemon/

      - name: Run integration tests
        run: |
          export PATH="$PWD/target/release:$PATH"
          cargo test --package rpytest -- --ignored integration

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test-rust, test-python]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Build and install
        run: |
          pip install pytest pytest-cov msgpack
          pip install -e daemon/
          cargo build --release

      - name: Generate Rust coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path rust-lcov.info

      - name: Generate Python coverage
        run: |
          cd daemon
          python -m pytest --cov=rpytest_daemon --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: rust-lcov.info,daemon/coverage.xml
          fail_ci_if_error: false
