[package]
name = "rpytest-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["pytest", "testing", "python", "daemon"]
categories = ["development-tools::testing"]
description = "Pure Rust daemon for rpytest - handles test execution, collection, and state management"

[[bin]]
name = "rpytest-daemon"
path = "src/main.rs"

[features]
default = ["embedded-python"]
embedded-python = ["dep:pyo3"]
subprocess-only = []

[dependencies]
# Workspace dependencies
rpytest-core = { version = "0.1.1", path = "../rpytest-core" }
rpytest-ipc = { version = "0.1.1", path = "../rpytest-ipc" }

# PyO3 for embedded Python execution (optional)
# Uses abi3 stable ABI for Python 3.8+ compatibility
pyo3 = { version = "0.22", features = ["auto-initialize", "abi3-py38"], optional = true }

# Performance - custom allocator
mimalloc = { version = "0.1", default-features = false }

# CPU detection for adaptive batch sizing
num_cpus = "1.16"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# IPC - NNG for communication with CLI
nng = "1.0.1"
async-nng = "0.2.0"

# Storage
sled = "0.34"

# Serialization
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Python AST parsing (for native test collection)
rustpython-parser = "0.4.0"
rustpython-ast = "0.4.0"

# Parallel processing
rayon = "1"

# Filesystem
walkdir = "2"
notify = "7"

# Hashing
sha256 = "1"
sha2 = "0.10"
hex = "0.4"

# Concurrency
parking_lot = "0.12"

# Utilities
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
humantime = "2"
dirs = "5"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

# UUID for context IDs
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
# PyO3 build config for conditional compilation
pyo3-build-config = "0.22"

[dev-dependencies]
tempfile = "3"
assert_matches = "1"
