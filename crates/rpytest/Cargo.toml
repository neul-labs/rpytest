[package]
name = "rpytest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["pytest", "testing", "python", "test-runner"]
categories = ["development-tools::testing", "command-line-utilities"]
description = "Rust-powered, drop-in replacement for pytest"

[[bin]]
name = "rpytest"
path = "src/main.rs"

[dependencies]
rpytest-core = { workspace = true }
rpytest-ipc = { workspace = true }

# Performance - custom allocator
mimalloc = { version = "0.1", default-features = false }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
configparser = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
console = { workspace = true }
which = { workspace = true }
libc = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
regex-lite = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
